name: Sync Fork from Upstream

# 每天北京时间 03:00 (UTC 19:00) 自动同步上游;
# 若检测到上游有新提交,自动触发编译(通过 repository_dispatch)
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/RROrg/rr.git
          git fetch upstream --prune
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge & push
        id: merge
        env:
          TARGET_BRANCH: "main"
        run: |
          BRANCH="$TARGET_BRANCH"
          echo "本地分支: $BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"
          BEFORE=$(git rev-parse HEAD)
          if git show-ref --verify --quiet "refs/remotes/upstream/$BRANCH"; then
            git merge --ff-only "upstream/$BRANCH" || git merge --no-edit "upstream/$BRANCH"
          else
            UP_HEAD=$(git symbolic-ref --short refs/remotes/upstream/HEAD | sed 's#upstream/##')
            git merge --no-edit "upstream/$UP_HEAD"
          fi
          git push origin "$BRANCH"
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "上游有新提交: $BEFORE -> $AFTER"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "已是最新,无需编译"
          fi

      - name: 触发编译
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "上游源码有改动,触发编译..."
          gh api repos/nanxi9899/rr/dispatches \
            -f event_type=upstream-changed
          echo "已发送编译事件"
