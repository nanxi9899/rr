name: Sync Fork from Upstream

# 每天北京时间 03:00(UTC 19:00)自动同步上游;也可手动触发
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 添加 upstream 远程并 fetch
        run: |
          git remote add upstream https://github.com/${{ github.event.repository.parent.full_name }}.git 2>/dev/null || \
            git remote set-url upstream https://github.com/${{ github.event.repository.parent.full_name }}.git
          git fetch upstream --prune

      - name: 检测上游默认分支并合并
        run: |
          # 取上游默认分支名
          UP_BRANCH=$(git symbolic-ref --short refs/remotes/upstream/HEAD 2>/dev/null || echo "")
          if [ -z "$UP_BRANCH" ]; then
            # 回退:用仓库记录的父仓库默认分支
            UP_BRANCH="${{ github.event.repository.parent.default_branch }}"
          fi
          UP_BRANCH=${UP_BRANCH#upstream/}
          LOCAL_BRANCH="${{ github.event.repository.default_branch }}"
          echo "上游分支: $UP_BRANCH -> 本地分支: $LOCAL_BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 切到本地默认分支
          git checkout "$LOCAL_BRANCH"
          git reset --hard "origin/$LOCAL_BRANCH"

          # 若上游分支与本地同名,直接 fast-forward;否则合并到当前分支
          if git show-ref --verify --quiet "refs/remotes/upstream/$LOCAL_BRANCH"; then
            git merge --ff-only "upstream/$LOCAL_BRANCH" || \
              git merge --no-edit "upstream/$LOCAL_BRANCH"
          else
            git merge --no-edit "upstream/$UP_BRANCH"
          fi

          git push origin "$LOCAL_BRANCH"
