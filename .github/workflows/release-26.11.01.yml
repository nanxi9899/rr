name: Create RR 26.11.01 Release

on:
  push:
    paths:
      - '.github/workflows/release-26.11.01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: main

      - name: Create Release 26.11.01
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="26.11.01"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skip."
          else
            gh release create "$TAG" \
              --target main \
              --title "RR 26.11.01 (i915 6.18.56 + HDD db 3.7.140)" \
              --notes-file README-26.11.01.md
          fi
          echo "---- release ----"
          gh release view "$TAG"
