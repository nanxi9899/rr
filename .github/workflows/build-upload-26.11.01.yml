name: Build & Upload RR 26.11.01

on:
  push:
    paths:
      - 'scripts/build-custom-26.11.01.sh'
      - '.github/workflows/build-upload-26.11.01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd cpio zip unzip

      - name: Build and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sudo -E bash scripts/build-custom-26.11.01.sh
