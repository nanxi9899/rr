name: Build & Upload RR 26.11.01

on:
  push:
    paths:
      - 'scripts/build-custom-26.11.01.sh'
      - '.github/workflows/build-upload-26.11.01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd cpio zip unzip parted

      - name: Build and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          sudo GH_TOKEN="$GH_TOKEN" bash -x scripts/build-custom-26.11.01.sh 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "BUILD_RC=$RC" | tee -a build.log
          exit $RC

      - name: Publish build log to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build.log ]; then
            B64=$(base64 -w0 build.log)
            gh api --method PUT repos/nanxi9899/rr/contents/build-diag.log \
              -f message="ci: publish build diagnostic log" \
              -f content="$B64" -f branch="main" || true
          fi
