name: Cleanup old releases and tags

on:
  push:
    paths:
      - '.github/workflows/cleanup-old-versions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old release and ALL old tags (keep 26.11.01 only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "=== Delete old release 26.11.0 ==="
          gh release delete 26.11.0 --repo nanxi9899/rr --yes || true

          echo "=== Delete ALL old tags (paginated, loop until clean) ==="
          for pass in 1 2 3 4 5; do
            TAGS=$(gh api 'repos/nanxi9899/rr/tags?per_page=100' --paginate --jq '.[].name')
            REMAIN=$(printf '%s\n' "$TAGS" | grep -v '^26\.11\.01$' | grep -c . || true)
            echo "pass ${pass}: ${REMAIN} old tags remaining"
            [ "$REMAIN" -eq 0 ] && break
            for t in $TAGS; do
              [ "$t" = "26.11.01" ] && continue
              if gh api --method DELETE "repos/nanxi9899/rr/git/refs/tags/$t" >/dev/null 2>&1; then
                echo "  DELETED $t"
              else
                echo "  FAILED $t"
              fi
            done
          done

          echo "=== FINAL: releases ==="
          gh release list --repo nanxi9899/rr
          echo "=== FINAL: tags ==="
          gh api 'repos/nanxi9899/rr/tags?per_page=100' --paginate --jq '.[].name'
          echo "=== CLEANUP DONE ==="
